<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up Form</title>
    <style>
      .last-name,
      .first-name {
        width: 93px;
      }
      .email {
        display: block;
        margin-top: 10px;
        margin-bottom: 11px;
        width: 200px;
      }

      .sign-up-btn {
        background-color: rgb(54, 135, 215);
        color: white;
        padding-top: 8px;
        padding-bottom: 8px;
        padding-left: 80px;
        padding-right: 80px;
        border: none;
        border-radius: 4px;
      }
      .request-text {
        font-size: 30px;
        font-family: Arial, Helvetica, sans-serif;
        width: 400px;
      }
      .destination,
      .location {
        display: block;
        border: none;
        background-color: rgb(247, 235, 235);
        width: 250px;
        padding-top: 8px;
        padding-bottom: 8px;
        padding-left: 10px;
        margin-bottom: 10px;
      }

      .request-btn {
        background-color: black;
        color: white;
        border: none;
        padding-left: 13px;
        padding-right: 13px;
        padding-top: 8px;
        padding-bottom: 8px;
      }
      .schedule-btn {
        background-color: rgb(247, 235, 235);
        border: none;
        padding-left: 13px;
        padding-right: 13px;
        padding-top: 8px;
        padding-bottom: 8px;
      }
      .div-example {
      }
    </style>
  </head>
  <body>
    <input type="text" class="first-name" placeholder="First name" />
    <input type="text" class="last-name" placeholder="Last name" />
    <input type="text" class="email" placeholder="Email" />
    <button class="sign-up-btn">Sign Up</button>
    <div class="div-example">
      <p class="request-text">Request a ride now</p>
      <input type="text" class="location" placeholder="Enter pickup location" />
      <input type="text" class="destination" placeholder="Enter destination" />
      <button class="request-btn">Request now</button>
      <button class="schedule-btn">Schedule for later</button>
    </div>
  </body>
</html>
