<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>12g - flexbox</title>
    <style>
      p {
        margin: 0;
      }
      .container {
        width: 500px;
        margin-top: 20px;
      }
      .profile-flex {
        display: flex;
        flex-direction: row;
        align-items: center;
        margin-bottom: 15px;
      }

      .pp-div {
        width: 50px;
        height: 50px;
        margin-right: 10px;
      }
      .pp {
        width: 100%;
        height: 100%;
        border-radius: 50%;
      }

      .profile-info {
        width: 200px;
      }
      .follow {
        margin-left: 100px;
      }
      .follow-btn {
        background-color: brown;
        padding-left: 5px;
        padding-right: 5px;
        padding-top: 6px;
        padding-bottom: 6px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="profile-flex">
        <div class="pp-div">
          <img src="channels/channel-1.jpeg" class="pp" />
        </div>
        <div class="profile-info">
          <p class="name">Oliver</p>
          <p class="nickname">the cat</p>
          <p class="stat">Popular</p>
        </div>
        <div class="follow">
          <button class="follow-btn">Follow</button>
        </div>
      </div>
      <div class="profile-flex">
        <div class="pp-div">
          <img src="channels/channel-3.jpeg" class="pp" />
        </div>
        <div class="profile-info">
          <p class="name">Mimi</p>
          <p class="nickname">Sleepy cat</p>
          <p class="stat">Popular</p>
        </div>
        <div class="follow">
          <button class="follow-btn">Follow</button>
        </div>
      </div>
      <div class="profile-flex">
        <div class="pp-div">
          <img src="channels/channel-2.jpeg" class="pp" />
        </div>
        <div class="profile-info">
          <p class="name">Rex</p>
          <p class="nickname">Happy bulldog</p>
          <p class="stat">Popular</p>
        </div>
        <div class="follow">
          <button class="follow-btn">Follow</button>
        </div>
      </div>
    </div>
  </body>
</html>
