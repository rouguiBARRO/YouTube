<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Position-fixed-practice</title>
  </head>
  <body style="height: 3000px">
    <div
      style="
        background-color: green;
        position: fixed;
        color: white;
        top: 0;
        bottom: 0;
        right: 0;
        width: 100px;
      "
    >
      right sidebar
    </div>
    <div
      style="
        position: fixed;
        top: 0;
        bottom: 0;
        right: 0;
        left: 0;
        background-color: rgba(0, 0, 0, 0.6);
        display: flex;
        justify-content: center;
        align-items: center;
      "
    >
      <div
        style="
          background-color: white;
          height: 200px;
          width: 500px;
          border-radius: 3px;
        "
      >
        Modal title <br />
        This is a modal <br /><button>Close</button>
      </div>
    </div>
  </body>
</html>
