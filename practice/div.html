<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Div</title>
    <style>
      .red-square {
        width: 100px;
        height: 100px;
        background-color: red;
        margin-bottom: 10px;
      }
      .green-circle {
        height: 100px;
        width: 100px;
        border-radius: 50%;
        background-color: green;
      }
      .satisfied-div {
        border-color: firebrick;
        border-width: 3px;
        border-style: solid;
        width: 300px;
        padding-left: 20px;
        padding-bottom: 10px;
        padding-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="red-square"></div>
    <div class="green-circle"></div>
    <div class="satisfied-div">
      <p>Satisfied with our services?</p>
      <button>Yes</button>
      <button>No</button>
    </div>
  </body>
</html>
