<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Position-relative & position absolute</title>
    <style>
      body {
        background-color: antiquewhite;
      }
      .container {
        width: 200px;
        position: relative;
      }
      .chemise {
        width: 100%;
      }
      .promo {
        position: absolute;
        top: 5px;
        right: 0px;
        background-color: black;
        color: white;
        padding: 4px 6px;
        font-size: 10px;
      }
      .promo:hover {
        background-color: rebeccapurple;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="chemise.jpg" class="chemise" />
      <div class="promo">20% OFF</div>
    </div>
  </body>
</html>
