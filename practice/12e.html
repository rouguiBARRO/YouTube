<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex practice</title>
    <style>
      .container {
        border-width: 1px;
        border-style: solid;
        border-color: rgb(200, 200, 200);
        width: 300px;
        border-radius: 6px;
      }
      .notifs {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        padding-top: 6px;
        padding-bottom: 6px;
        padding-left: 12px;
        padding-right: 12px;
      }
      .number {
        border: none;
        border-radius: 10px;
        background-color: rgb(13, 94, 215);
        padding-left: 8px;
        padding-right: 8px;
        padding-top: 3px;
        padding-bottom: 3px;
        color: white;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="notifs">
        <div class="what">Home</div>
        <div class="number">14</div>
      </div>
      <div class="notifs">
        <div class="what">Notifications</div>
        <div class="number">3</div>
      </div>
      <div class="notifs">
        <div class="what">Messages</div>
        <div class="number">5</div>
      </div>
    </div>
  </body>
</html>
