<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Position-relative & position absolute</title>
    <style>
      body {
        background-color: antiquewhite;
      }
      .container {
        width: 200px;
        position: relative;
      }
      .chemise {
        width: 100%;
      }
      .promo {
        position: absolute;
        top: 5px;
        right: 0px;
        background-color: black;
        color: white;
        padding: 4px 6px;
        font-size: 10px;
      }
      .overlay {
        background-color: rgba(255, 255, 255, 0.8);
        position: absolute;
        bottom: 0;
        right: 0;
        left: 0;
        height: 72px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="chemise.jpg" class="chemise" />
      <div class="promo">20% OFF</div>
      <div class="overlay"><button>Add to Cart</button></div>
    </div>
  </body>
</html>
