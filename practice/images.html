<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exos images</title>
    <style>
      .img1 {
        width: 200px;
        border-radius: 20px;
      }
      .img2 {
        width: 200px;
        height: 200px;
        object-fit: contain;
        object-position: right;
      }
      .img3 {
        width: 200px;
        height: 200px;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <img
      src="9.jpg"
      alt="image d'une personne entrant dans une mosquée"
      class="img1"
    />

    <img
      src="9.jpg"
      alt="image d'une personne entrant dans une mosquée"
      class="img2"
    />

    <img
      src="9.jpg"
      alt="image d'une personne entrant dans une mosquée"
      class="img3"
    />
  </body>
</html>
