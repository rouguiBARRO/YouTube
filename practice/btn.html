<style>
  button {
    background-color: red;
    color: white;
    padding-bottom: 15;
    padding-top: 15;
    padding-left: 17;
    padding-right: 17;
    border-bottom-right-radius: 8px;
    border-top-left-radius: 8px;
    border-top-color: green;
    border-bottom: none;
  }

  .tweet-button {
    background-color: rgb(29, 155, 240);
    color: white;
    border: none;

    padding-top: 10px;
    padding-bottom: 10px;
    padding-left: 16px;
    padding-right: 16px;

    border-radius: 9999px;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    margin-left: 8px;
    transition: box-shadow 0.15s;
    vertical-align: top;
  }

  .shadow-button {
    background-color: green;
    color: white;
    border: none;
    font-size: 18px;
    padding-top: 8px;
    padding-bottom: 8px;
    padding-left: 16px;
    padding-right: 16px;
    cursor: pointer;
    box-shadow: 3px 3px 5px rgba(0, 0, 0, 0.3);
  }

  .shadow-button:active {
    margin-top: 3px;
    margin-left: 3px;
    box-shadow: none;
  }

  .stretch-button {
    background-color: green;
    color: white;
    border: none;
    font-size: 18px;
    padding-top: 8px;
    padding-bottom: 8px;
    cursor: pointer;

    padding-left: 15px;
    padding-right: 15px;
    margin-left: 10px;
    margin-right: 10px;

    transition:
      padding 0.15s,
      margin 0.15s;
  }

  .stretch-button:hover {
    padding-left: 25px;
    padding-right: 25px;
    margin-left: 0px;
  }
</style>

<button>SUBSCRIBE</button>
<button class="tweet-button">Tweet</button>
<button class="shadow-button">Shadow</button>
<button class="stretch-button">One</button>
<button class="stretch-button">Two</button>
<button class="stretch-button">Three</button>
<p class="p1">this is a paragraph</p>
<p class="p2">this is a paragraph, yes!</p>
