<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .search {
        width: 130px;
        border-style: solid;
        border-radius: 4px;
        border-width: 1px;
        padding-top: 7px;
        padding-bottom: 7px;
        padding-left: 10px;
        font-size: 16px;
        margin-bottom: 40px;
      }

      .search-google {
        font-size: 16px;
        width: 500px;
        border: none;
        box-shadow: 0 1px 5px rgba(0, 0, 0, 0.3);
        padding-top: 17px;
        padding-bottom: 17px;
        padding-left: 15px;
        border-radius: 30px;
      }

      .linkedin {
        height: 17px;
        width: 300px;
        margin-top: 0px;
      }

      .email {
        margin-bottom: 4px;
      }

      .agree-btn {
        background-color: rgb(10, 102, 194);
        border: none;
        border-radius: 30px;
        color: white;
        padding-left: 70px;
        padding-right: 70px;
        padding-top: 8px;
        padding-bottom: 8px;
        margin-bottom: 50px;
      }

      .pp {
        object-fit: cover;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        vertical-align: middle;
      }

      .desc {
        vertical-align: middle;
        border: none;
      }

      .tweet-btn {
        vertical-align: middle;
        background-color: rgb(54, 135, 215);
        color: white;
        border: none;
        border-radius: 30px;
        padding-bottom: 8px;
        padding-top: 8px;
        padding-left: 10px;
        padding-right: 10px;
        font-weight: bold;
      }

      .test2 {
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <input type="text" placeholder="Search" class="search" />
    <input
      type="text"
      placeholder="Search Google or type a URL"
      class="search-google"
    />
    <p class="email">Email</p>
    <input type="text" class="linkedin" />
    <p>By clicking Agree & Join, you agree to the Privacy Policy.</p>
    <button class="agree-btn">Agree & Join</button>
    <br />

    <img src="9.jpg" alt="photo" class="pp" />
    <input type="text" placeholder="What's happening?" class="desc" />
    <button class="tweet-btn">Tweet</button>
    <p class="test1">test 1</p>
    <p class="test2">test 2</p>
    <input type="text" />
  </body>
</html>
